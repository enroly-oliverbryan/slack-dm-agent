display_information:
  name: Slack DM Agent
  description: Watches your DMs from an allowlist and replies as your agent, in your tone.
oauth_config:
  scopes:
    user:
      - im:history # read DM messages
      - im:read # DM channel info
      - users:read # resolve sender names
      - chat:write # send agent replies from your account
      - search:read # later: recon of sent messages
      - reactions:read # ✅ / ❌ feedback on agent answers
      - reactions:write # add ✅ / ❌ to agent answers
settings:
  event_subscriptions:
    user_events:
      - message.im
      - reaction_added
      - reaction_removed
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
