display_information:
  name: Oliver Auto-Reply
  description: Watches Oliver's DMs from an allowlist and drafts replies.
oauth_config:
  scopes:
    user:
      - im:history # read DM messages
      - im:read # DM channel info
      - users:read # resolve sender names
      - chat:write # later: send replies as Oliver
      - search:read # later: recon of sent messages
settings:
  event_subscriptions:
    user_events:
      - message.im
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
